<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="55%" stop-color="#171d45"/>
      <stop offset="100%" stop-color="#232a5c"/>
    </linearGradient>

    <radialGradient id="moonBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e8ecf5"/>
      <stop offset="100%" stop-color="#cfd6e6"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8ecf5" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#e8ecf5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e8ecf5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shootTail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="moonClip">
      <circle cx="0" cy="0" r="70"/>
    </clipPath>
  </defs>

  <!-- sky background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- drifting cloud silhouettes, behind moon -->
  <g opacity="0.45">
    <g transform="translate(-200,110)">
      <ellipse cx="0" cy="0" rx="70" ry="22" fill="#171d45"/>
      <ellipse cx="-40" cy="6" rx="34" ry="16" fill="#171d45"/>
      <ellipse cx="42" cy="8" rx="30" ry="14" fill="#171d45"/>
      <animateTransform attributeName="transform" type="translate"
        values="-200,110; 900,110" dur="38s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(-260,270)">
      <ellipse cx="0" cy="0" rx="55" ry="18" fill="#171d45"/>
      <ellipse cx="-30" cy="5" rx="26" ry="12" fill="#171d45"/>
      <ellipse cx="32" cy="6" rx="24" ry="11" fill="#171d45"/>
      <animateTransform attributeName="transform" type="translate"
        values="-260,270; 900,270" dur="52s" begin="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- twinkling stars, scattered with varied size / timing -->
  <g fill="#ffffff">
    <circle cx="40"  cy="60"  r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="95"  cy="30"  r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="90"  r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="45"  r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="120" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="55"  r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="30"  cy="160" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="80"  cy="210" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="180" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="250" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="200" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="10"  cy="280" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="150" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="70"  r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="200" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="40"  r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="260" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="330" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="330" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="360" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="330" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="290" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="340" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="20"  cy="400" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="90"  cy="420" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="400" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="410" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="390" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="330" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="380" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="460" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="460" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="60"  r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="140" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="220" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="300" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="380" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="420" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="360" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="450" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting stars -->
  <g opacity="0">
    <line x1="0" y1="0" x2="90" y2="0" stroke="url(#shootTail)" stroke-width="2"
      transform="translate(600,60) rotate(25)"/>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; -280,170" dur="7s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.2;1" dur="7s" begin="1s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="70" y2="0" stroke="url(#shootTail)" stroke-width="1.6"
      transform="translate(720,100) rotate(20)"/>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; -260,150" dur="9s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.2;1" dur="9s" begin="4s" repeatCount="indefinite"/>
  </g>

  <!-- moon group: floats up and down, glows, rotates craters subtly -->
  <g transform="translate(560,140)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-20; 0,0" dur="6s" repeatCount="indefinite"/>

    <!-- pulsing glow -->
    <circle r="120" fill="url(#moonGlow)">
      <animate attributeName="r" values="110;125;110" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- moon body -->
    <circle r="70" fill="url(#moonBody)"/>

    <!-- craters, clipped to moon circle, with a very slow drift for life-like feel -->
    <g clip-path="url(#moonClip)" fill="#96a0be" opacity="0.55">
      <g>
        <circle cx="-20" cy="-25" r="13"/>
        <circle cx="20" cy="10" r="8"/>
        <circle cx="-10" cy="30" r="6"/>
        <circle cx="35" cy="-15" r="5"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0;3;0;-3;0" dur="14s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
